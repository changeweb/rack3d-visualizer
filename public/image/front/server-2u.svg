<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 210">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2228"/>
      <stop offset="100%" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2e38"/>
      <stop offset="100%" stop-color="#1a1e28"/>
    </linearGradient>
  </defs>
  <rect width="576" height="210" fill="url(#bg)"/>
  <rect width="576" height="2" fill="#2d3340"/>
  <rect y="208" width="576" height="2" fill="#2d3340"/>
  <!-- Rack ears -->
  <rect width="22" height="210" fill="url(#ear)"/>
  <rect x="554" width="22" height="210" fill="url(#ear)"/>
  <circle cx="11" cy="30" r="6" fill="#111" stroke="#3a3f4c" stroke-width="1"/>
  <circle cx="11" cy="105" r="6" fill="#111" stroke="#3a3f4c" stroke-width="1"/>
  <circle cx="11" cy="180" r="6" fill="#111" stroke="#3a3f4c" stroke-width="1"/>
  <circle cx="565" cy="30" r="6" fill="#111" stroke="#3a3f4c" stroke-width="1"/>
  <circle cx="565" cy="105" r="6" fill="#111" stroke="#3a3f4c" stroke-width="1"/>
  <circle cx="565" cy="180" r="6" fill="#111" stroke="#3a3f4c" stroke-width="1"/>
  <!-- HP logo area -->
  <rect x="26" y="18" width="100" height="40" rx="2" fill="#0c0e14" stroke="#1e2430" stroke-width="0.5"/>
  <text x="38" y="42" fill="#0076cc" font-family="Arial,sans-serif" font-size="20" font-weight="bold">HP</text>
  <text x="30" y="68" fill="#c8d0de" font-family="Arial,sans-serif" font-size="10" font-weight="bold">ProLiant DL380</text>
  <text x="30" y="82" fill="#7a8499" font-family="Arial,sans-serif" font-size="8">Gen10 Plus</text>
  <!-- Power button -->
  <circle cx="45" cy="110" r="18" fill="#0d1018" stroke="#0076cc" stroke-width="2.5"/>
  <circle cx="45" cy="110" r="9" fill="#0076cc" opacity="0.85"/>
  <line x1="45" y1="102" x2="45" y2="110" stroke="#fff" stroke-width="1.5"/>
  <!-- Status panel -->
  <rect x="72" y="95" width="12" height="12" rx="2" fill="#00cc44"/>
  <rect x="88" y="95" width="12" height="12" rx="2" fill="#ffaa00" opacity="0.4"/>
  <rect x="104" y="95" width="12" height="12" rx="2" fill="#ff4444" opacity="0.3"/>
  <text x="72" y="122" fill="#7a8499" font-family="Arial,sans-serif" font-size="7">PWR HLTH UID</text>
  <!-- 8 drive bays in 2 rows -->
  <rect x="140" y="20" width="60" height="80" rx="2" fill="#0c0e14" stroke="#2a2e38" stroke-width="1"/>
  <rect x="143" y="23" width="54" height="35" rx="1" fill="#141820" stroke="#1e2430" stroke-width="0.5"/>
  <rect x="143" y="61" width="54" height="35" rx="1" fill="#141820" stroke="#1e2430" stroke-width="0.5"/>
  <circle cx="191" cy="40" r="3" fill="#00cc44" opacity="0.85"/>
  <circle cx="191" cy="79" r="3" fill="#00cc44" opacity="0.85"/>

  <rect x="206" y="20" width="60" height="80" rx="2" fill="#0c0e14" stroke="#2a2e38" stroke-width="1"/>
  <rect x="209" y="23" width="54" height="35" rx="1" fill="#141820" stroke="#1e2430" stroke-width="0.5"/>
  <rect x="209" y="61" width="54" height="35" rx="1" fill="#141820" stroke="#1e2430" stroke-width="0.5"/>
  <circle cx="257" cy="40" r="3" fill="#00cc44" opacity="0.85"/>
  <circle cx="257" cy="79" r="3" fill="#00cc44" opacity="0.85"/>

  <rect x="272" y="20" width="60" height="80" rx="2" fill="#0c0e14" stroke="#2a2e38" stroke-width="1"/>
  <rect x="275" y="23" width="54" height="35" rx="1" fill="#141820" stroke="#1e2430" stroke-width="0.5"/>
  <rect x="275" y="61" width="54" height="35" rx="1" fill="#141820" stroke="#1e2430" stroke-width="0.5"/>
  <circle cx="323" cy="40" r="3" fill="#00cc44" opacity="0.85"/>
  <circle cx="323" cy="79" r="3" fill="#00cc44" opacity="0.85"/>

  <rect x="338" y="20" width="60" height="80" rx="2" fill="#0c0e14" stroke="#2a2e38" stroke-width="1"/>
  <rect x="341" y="23" width="54" height="35" rx="1" fill="#141820" stroke="#1e2430" stroke-width="0.5"/>
  <rect x="341" y="61" width="54" height="35" rx="1" fill="#141820" stroke="#1e2430" stroke-width="0.5"/>
  <circle cx="389" cy="40" r="3" fill="#00cc44" opacity="0.85"/>
  <circle cx="389" cy="79" r="3" fill="#00cc44" opacity="0.85"/>

  <!-- Ports section -->
  <rect x="404" y="20" width="140" height="80" rx="2" fill="#0c0e14" stroke="#2a2e38" stroke-width="0.5"/>
  <text x="415" y="38" fill="#7a8499" font-family="Arial,sans-serif" font-size="7">PORTS</text>
  <!-- NIC ports row 1 -->
  <rect x="410" y="42" width="18" height="14" rx="1" fill="#0a0c12" stroke="#2a2e38" stroke-width="0.5"/>
  <rect x="432" y="42" width="18" height="14" rx="1" fill="#0a0c12" stroke="#2a2e38" stroke-width="0.5"/>
  <rect x="454" y="42" width="18" height="14" rx="1" fill="#0a0c12" stroke="#2a2e38" stroke-width="0.5"/>
  <rect x="476" y="42" width="18" height="14" rx="1" fill="#0a0c12" stroke="#2a2e38" stroke-width="0.5"/>
  <!-- Ports row 2 -->
  <rect x="410" y="60" width="18" height="14" rx="1" fill="#0a0c12" stroke="#2a2e38" stroke-width="0.5"/>
  <rect x="432" y="60" width="18" height="14" rx="1" fill="#0a0c12" stroke="#2a2e38" stroke-width="0.5"/>
  <!-- iLO port -->
  <rect x="454" y="60" width="20" height="14" rx="1" fill="#0a0c12" stroke="#0076cc" stroke-width="0.5"/>
  <text x="455" y="70" fill="#0076cc" font-family="Arial,sans-serif" font-size="6">iLO</text>
  <!-- USB/VGA -->
  <rect x="498" y="50" width="12" height="9" rx="1" fill="#0a0c12" stroke="#333" stroke-width="0.5"/>
  <rect x="516" y="48" width="16" height="12" rx="1" fill="#0a0c12" stroke="#333" stroke-width="0.5"/>
  <!-- Vent section -->
  <rect x="26" y="130" width="520" height="55" rx="2" fill="#0c0e14" stroke="#1e2430" stroke-width="0.5"/>
  <text x="36" y="147" fill="#7a8499" font-family="Arial,sans-serif" font-size="7">VENTILATION</text>
  <!-- Vent slots -->
  <rect x="36" y="152" width="3" height="25" rx="1" fill="#1e2430"/>
  <rect x="42" y="152" width="3" height="25" rx="1" fill="#1e2430"/>
  <rect x="48" y="152" width="3" height="25" rx="1" fill="#1e2430"/>
  <rect x="54" y="152" width="3" height="25" rx="1" fill="#1e2430"/>
  <rect x="60" y="152" width="3" height="25" rx="1" fill="#1e2430"/>
  <rect x="66" y="152" width="3" height="25" rx="1" fill="#1e2430"/>
  <rect x="72" y="152" width="3" height="25" rx="1" fill="#1e2430"/>
  <rect x="78" y="152" width="3" height="25" rx="1" fill="#1e2430"/>
  <rect x="84" y="152" width="3" height="25" rx="1" fill="#1e2430"/>
  <rect x="90" y="152" width="3" height="25" rx="1" fill="#1e2430"/>
  <rect x="96" y="152" width="3" height="25" rx="1" fill="#1e2430"/>
  <rect x="102" y="152" width="3" height="25" rx="1" fill="#1e2430"/>
  <!-- Blue accent line -->
  <rect x="22" y="0" width="532" height="2.5" fill="#0076cc" opacity="0.5"/>
</svg>

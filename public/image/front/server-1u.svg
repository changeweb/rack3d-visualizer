<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2228"/>
      <stop offset="100%" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2e38"/>
      <stop offset="100%" stop-color="#1a1e28"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="576" height="100" fill="url(#bg)"/>
  <!-- Top/bottom edge lines -->
  <rect width="576" height="1.5" fill="#2d3340"/>
  <rect y="98.5" width="576" height="1.5" fill="#2d3340"/>
  <!-- Rack ears -->
  <rect width="22" height="100" fill="url(#ear)"/>
  <rect x="554" width="22" height="100" fill="url(#ear)"/>
  <!-- Ear screws -->
  <circle cx="11" cy="22" r="5" fill="#111" stroke="#3a3f4c" stroke-width="1"/>
  <circle cx="11" cy="78" r="5" fill="#111" stroke="#3a3f4c" stroke-width="1"/>
  <circle cx="565" cy="22" r="5" fill="#111" stroke="#3a3f4c" stroke-width="1"/>
  <circle cx="565" cy="78" r="5" fill="#111" stroke="#3a3f4c" stroke-width="1"/>
  <!-- Power button -->
  <circle cx="45" cy="50" r="14" fill="#0d1018" stroke="#2288ff" stroke-width="2"/>
  <circle cx="45" cy="50" r="7" fill="#2288ff" opacity="0.9"/>
  <line x1="45" y1="43" x2="45" y2="50" stroke="#fff" stroke-width="1.5"/>
  <!-- Status LEDs -->
  <rect x="66" y="35" width="7" height="7" rx="1" fill="#00cc44"/>
  <rect x="66" y="46" width="7" height="7" rx="1" fill="#ffaa00" opacity="0.5"/>
  <rect x="66" y="57" width="7" height="7" rx="1" fill="#ff4444" opacity="0.3"/>
  <!-- Brand & model -->
  <text x="82" y="44" fill="#c8d0de" font-family="Arial,sans-serif" font-size="12" font-weight="bold" letter-spacing="1">DELL</text>
  <text x="82" y="60" fill="#7a8499" font-family="Arial,sans-serif" font-size="9">PowerEdge R650</text>
  <!-- Drive bays -->
  <rect x="170" y="28" width="42" height="44" rx="2" fill="#0c0e14" stroke="#2a2e38" stroke-width="1"/>
  <rect x="172" y="30" width="38" height="18" rx="1" fill="#141820" stroke="#1e2430" stroke-width="0.5"/>
  <rect x="172" y="51" width="38" height="18" rx="1" fill="#141820" stroke="#1e2430" stroke-width="0.5"/>
  <circle cx="206" cy="39" r="2.5" fill="#00cc44" opacity="0.8"/>
  <circle cx="206" cy="60" r="2.5" fill="#00cc44" opacity="0.8"/>
  <rect x="218" y="28" width="42" height="44" rx="2" fill="#0c0e14" stroke="#2a2e38" stroke-width="1"/>
  <rect x="220" y="30" width="38" height="18" rx="1" fill="#141820" stroke="#1e2430" stroke-width="0.5"/>
  <rect x="220" y="51" width="38" height="18" rx="1" fill="#141820" stroke="#1e2430" stroke-width="0.5"/>
  <circle cx="254" cy="39" r="2.5" fill="#00cc44" opacity="0.8"/>
  <circle cx="254" cy="60" r="2.5" fill="#00cc44" opacity="0.8"/>
  <rect x="266" y="28" width="42" height="44" rx="2" fill="#0c0e14" stroke="#2a2e38" stroke-width="1"/>
  <rect x="268" y="30" width="38" height="18" rx="1" fill="#141820" stroke="#1e2430" stroke-width="0.5"/>
  <rect x="268" y="51" width="38" height="18" rx="1" fill="#141820" stroke="#1e2430" stroke-width="0.5"/>
  <circle cx="302" cy="39" r="2.5" fill="#00cc44" opacity="0.8"/>
  <circle cx="302" cy="60" r="2.5" fill="#00cc44" opacity="0.8"/>
  <rect x="314" y="28" width="42" height="44" rx="2" fill="#0c0e14" stroke="#2a2e38" stroke-width="1"/>
  <rect x="316" y="30" width="38" height="18" rx="1" fill="#141820" stroke="#1e2430" stroke-width="0.5"/>
  <rect x="316" y="51" width="38" height="18" rx="1" fill="#141820" stroke="#1e2430" stroke-width="0.5"/>
  <circle cx="350" cy="39" r="2.5" fill="#00cc44" opacity="0.8"/>
  <circle cx="350" cy="60" r="2.5" fill="#00cc44" opacity="0.8"/>
  <!-- USB port -->
  <rect x="370" y="42" width="12" height="8" rx="1" fill="#0a0c12" stroke="#333" stroke-width="0.5"/>
  <!-- VGA port -->
  <rect x="388" y="40" width="16" height="12" rx="1" fill="#0a0c12" stroke="#333" stroke-width="0.5"/>
  <!-- iDRAC port -->
  <rect x="412" y="40" width="18" height="12" rx="1" fill="#0a0c12" stroke="#2288ff" stroke-width="0.5"/>
  <text x="413" y="49" fill="#2288ff" font-family="Arial,sans-serif" font-size="6">iDRAC</text>
  <!-- NIC ports -->
  <rect x="440" y="38" width="18" height="14" rx="1" fill="#0a0c12" stroke="#2a2e38" stroke-width="0.5"/>
  <rect x="462" y="38" width="18" height="14" rx="1" fill="#0a0c12" stroke="#2a2e38" stroke-width="0.5"/>
  <rect x="484" y="38" width="18" height="14" rx="1" fill="#0a0c12" stroke="#2a2e38" stroke-width="0.5"/>
  <rect x="506" y="38" width="18" height="14" rx="1" fill="#0a0c12" stroke="#2a2e38" stroke-width="0.5"/>
  <!-- Vent lines -->
  <rect x="528" y="35" width="2" height="30" rx="1" fill="#1e2430"/>
  <rect x="533" y="35" width="2" height="30" rx="1" fill="#1e2430"/>
  <rect x="538" y="35" width="2" height="30" rx="1" fill="#1e2430"/>
  <rect x="543" y="35" width="2" height="30" rx="1" fill="#1e2430"/>
  <!-- Blue accent line -->
  <rect x="22" y="0" width="532" height="2" fill="#2288ff" opacity="0.4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e16"/>
      <stop offset="100%" stop-color="#0e080c"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#281420"/>
      <stop offset="100%" stop-color="#180e14"/>
    </linearGradient>
  </defs>
  <rect width="576" height="100" fill="url(#bg)"/>
  <rect width="576" height="1.5" fill="#2e1428"/>
  <rect y="98.5" width="576" height="1.5" fill="#2e1428"/>
  <rect width="22" height="100" fill="url(#ear)"/>
  <rect x="554" width="22" height="100" fill="url(#ear)"/>
  <circle cx="11" cy="25" r="5" fill="#111" stroke="#2e1428" stroke-width="1"/>
  <circle cx="11" cy="75" r="5" fill="#111" stroke="#2e1428" stroke-width="1"/>
  <circle cx="565" cy="25" r="5" fill="#111" stroke="#2e1428" stroke-width="1"/>
  <circle cx="565" cy="75" r="5" fill="#111" stroke="#2e1428" stroke-width="1"/>
  <!-- Brand -->
  <text x="30" y="28" fill="#ff55cc" font-family="Arial,sans-serif" font-size="10" font-weight="bold">SNORT</text>
  <text x="30" y="40" fill="#cc4499" font-family="Arial,sans-serif" font-size="7">IDS/IPS Sensor 3.0</text>
  <!-- Shield icon -->
  <path d="M32 50 L42 46 L52 50 L52 62 Q42 68 32 62 Z" fill="none" stroke="#ff55cc" stroke-width="1.5"/>
  <text x="38" y="62" fill="#ff55cc" font-family="Arial,sans-serif" font-size="9">✓</text>
  <!-- Status -->
  <circle cx="65" cy="76" r="5" fill="#00cc44"/>
  <text x="58" y="90" fill="#80305c" font-family="Arial,sans-serif" font-size="6">ACTIVE</text>
  <!-- Alert counter display -->
  <rect x="80" y="55" width="90" height="32" rx="2" fill="#0a0508" stroke="#ff55cc" stroke-width="0.8"/>
  <text x="86" y="67" fill="#ff55cc" font-family="'Courier New',monospace" font-size="7">ALERTS</text>
  <text x="86" y="79" fill="#ff55cc" font-family="'Courier New',monospace" font-size="8" font-weight="bold">2,847</text>
  <!-- Capture interfaces section -->
  <rect x="180" y="15" width="330" height="70" rx="3" fill="#0a0508" stroke="#281420" stroke-width="0.5"/>
  <text x="190" y="30" fill="#cc4499" font-family="Arial,sans-serif" font-size="7">Capture Interfaces / Management</text>
  <!-- 4 monitoring ports -->
  <rect x="190" y="36" width="22" height="14" rx="1" fill="#060306" stroke="#ff55cc" stroke-width="1"/>
  <rect x="216" y="36" width="22" height="14" rx="1" fill="#060306" stroke="#ff55cc" stroke-width="1"/>
  <rect x="242" y="36" width="22" height="14" rx="1" fill="#060306" stroke="#ff55cc" stroke-width="1"/>
  <rect x="268" y="36" width="22" height="14" rx="1" fill="#060306" stroke="#ff55cc" stroke-width="1"/>
  <!-- Capture LED - blinking style -->
  <circle cx="201" cy="52" r="3" fill="#ff55cc" opacity="0.9"/>
  <circle cx="227" cy="52" r="3" fill="#ff55cc" opacity="0.9"/>
  <circle cx="253" cy="52" r="3" fill="#ff55cc" opacity="0.6"/>
  <circle cx="279" cy="52" r="3" fill="#ff55cc" opacity="0.9"/>
  <text x="190" y="64" fill="#80305c" font-family="Arial,sans-serif" font-size="6">MON1 MON2 MON3 MON4</text>
  <!-- Additional ports -->
  <rect x="190" y="65" width="22" height="14" rx="1" fill="#060306" stroke="#281420" stroke-width="0.5"/>
  <rect x="216" y="65" width="22" height="14" rx="1" fill="#060306" stroke="#281420" stroke-width="0.5"/>
  <text x="190" y="83" fill="#80305c" font-family="Arial,sans-serif" font-size="6">CON  MGMT</text>
  <!-- Separator -->
  <line x1="306" y1="20" x2="306" y2="80" stroke="#281420" stroke-width="1"/>
  <!-- Processing stats -->
  <rect x="316" y="30" width="140" height="50" rx="2" fill="#060306" stroke="#281420" stroke-width="0.5"/>
  <text x="322" y="46" fill="#cc4499" font-family="'Courier New',monospace" font-size="7">Pkts/s: 1.2M</text>
  <text x="322" y="58" fill="#cc4499" font-family="'Courier New',monospace" font-size="7">Rules:  12,441</text>
  <text x="322" y="70" fill="#cc4499" font-family="'Courier New',monospace" font-size="7">CPU: 34%</text>
  <!-- Vents -->
  <rect x="466" y="18" width="80" height="64" rx="2" fill="#060306" stroke="#1e0e18" stroke-width="0.5"/>
  <rect x="472" y="24" width="2" height="52" rx="1" fill="#281420"/>
  <rect x="478" y="24" width="2" height="52" rx="1" fill="#281420"/>
  <rect x="484" y="24" width="2" height="52" rx="1" fill="#281420"/>
  <rect x="490" y="24" width="2" height="52" rx="1" fill="#281420"/>
  <rect x="496" y="24" width="2" height="52" rx="1" fill="#281420"/>
  <rect x="502" y="24" width="2" height="52" rx="1" fill="#281420"/>
  <rect x="508" y="24" width="2" height="52" rx="1" fill="#281420"/>
  <rect x="514" y="24" width="2" height="52" rx="1" fill="#281420"/>
  <rect x="520" y="24" width="2" height="52" rx="1" fill="#281420"/>
  <rect x="526" y="24" width="2" height="52" rx="1" fill="#281420"/>
  <rect x="532" y="24" width="2" height="52" rx="1" fill="#281420"/>
  <!-- Accent -->
  <rect x="22" y="0" width="532" height="2" fill="#ff55cc" opacity="0.5"/>
</svg>

  <rect x="188" y="62" width="20" height="18" rx="1" fill="#060a0e" stroke="#1e2838" stroke-width="0.5"/>
  <rect x="211" y="62" width="20" height="18" rx="1" fill="#060a0e" stroke="#1e2838" stroke-width="0.5"/>
  <rect x="234" y="62" width="20" height="18" rx="1" fill="#060a0e" stroke="#1e2838" stroke-width="0.5"/>
  <rect x="257" y="62" width="20" height="18" rx="1" fill="#060a0e" stroke="#1e2838" stroke-width="0.5"/>
  <rect x="280" y="62" width="20" height="18" rx="1" fill="#060a0e" stroke="#1e2838" stroke-width="0.5"/>
  <rect x="303" y="62" width="20" height="18" rx="1" fill="#060a0e" stroke="#1e2838" stroke-width="0.5"/>
  <rect x="326" y="62" width="20" height="18" rx="1" fill="#060a0e" stroke="#1e2838" stroke-width="0.5"/>
  <!-- LEDs row 2 -->
  <circle cx="175" cy="82" r="2.5" fill="#00cc44" opacity="0.9"/>
  <circle cx="198" cy="82" r="2.5" fill="#00cc44" opacity="0.9"/>
  <circle cx="221" cy="82" r="2.5" fill="#00cc44" opacity="0.9"/>
  <circle cx="244" cy="82" r="2.5" fill="#00cc44" opacity="0.9"/>
  <circle cx="267" cy="82" r="2.5" fill="#ffaa00" opacity="0.4"/>
  <circle cx="290" cy="82" r="2.5" fill="#00cc44" opacity="0.9"/>
  <circle cx="313" cy="82" r="2.5" fill="#00cc44" opacity="0.9"/>
  <circle cx="336" cy="82" r="2.5" fill="#00cc44" opacity="0.9"/>
  <text x="166" y="93" fill="#607888" font-family="Arial,sans-serif" font-size="5">09  10  11  12  13  14  15  16</text>
  <!-- Console ports section -->
  <line x1="359" y1="12" x2="359" y2="88" stroke="#1e2838" stroke-width="1"/>
  <text x="366" y="24" fill="#607888" font-family="Arial,sans-serif" font-size="7">Console</text>
  <!-- USB/KB/Mouse ports -->
  <rect x="366" y="28" width="18" height="14" rx="1" fill="#060a0e" stroke="#44aaff" stroke-width="0.8"/>
  <text x="368" y="38" fill="#44aaff" font-family="Arial,sans-serif" font-size="6">KB</text>

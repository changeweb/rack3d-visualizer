  <text x="440" y="24" fill="#607888" font-family="Arial,sans-serif" font-size="7">Cascade</text>
  <rect x="440" y="28" width="22" height="14" rx="1" fill="#060a0e" stroke="#44aaff" stroke-width="0.8"/>
  <rect x="466" y="28" width="22" height="14" rx="1" fill="#060a0e" stroke="#44aaff" stroke-width="0.8"/>
  <text x="440" y="50" fill="#607888" font-family="Arial,sans-serif" font-size="6">IN    OUT</text>
  <!-- Vents -->
  <rect x="498" y="15" width="46" height="70" rx="2" fill="#060a0e" stroke="#141820" stroke-width="0.5"/>
  <rect x="504" y="20" width="2" height="60" rx="1" fill="#1e2838"/>
  <rect x="510" y="20" width="2" height="60" rx="1" fill="#1e2838"/>
  <rect x="516" y="20" width="2" height="60" rx="1" fill="#1e2838"/>

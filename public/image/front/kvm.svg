  <text x="390" y="38" fill="#44aaff" font-family="Arial,sans-serif" font-size="6">MS</text>
  <!-- DVI port -->
  <rect x="366" y="48" width="32" height="18" rx="1" fill="#060a0e" stroke="#1e2838" stroke-width="0.5"/>
  <text x="371" y="60" fill="#607888" font-family="Arial,sans-serif" font-size="7">DVI</text>
  <!-- Audio -->
  <circle cx="418" cy="38" r="7" fill="#060a0e" stroke="#1e2838" stroke-width="0.5"/>

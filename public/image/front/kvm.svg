  <circle cx="198" cy="46" r="2.5" fill="#00cc44" opacity="0.9"/>
  <circle cx="221" cy="46" r="2.5" fill="#44aaff" opacity="1"/>
  <circle cx="244" cy="46" r="2.5" fill="#00cc44" opacity="0.9"/>
  <circle cx="267" cy="46" r="2.5" fill="#00cc44" opacity="0.9"/>
  <circle cx="290" cy="46" r="2.5" fill="#00cc44" opacity="0.9"/>
  <circle cx="313" cy="46" r="2.5" fill="#ffaa00" opacity="0.5"/>
  <circle cx="336" cy="46" r="2.5" fill="#00cc44" opacity="0.9"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101418"/>
      <stop offset="100%" stop-color="#080c10"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a2028"/>
      <stop offset="100%" stop-color="#101418"/>
    </linearGradient>
  </defs>
  <rect width="576" height="100" fill="url(#bg)"/>
  <rect width="576" height="1.5" fill="#1e2838"/>
  <rect y="98.5" width="576" height="1.5" fill="#1e2838"/>
  <rect width="22" height="100" fill="url(#ear)"/>
  <rect x="554" width="22" height="100" fill="url(#ear)"/>
  <circle cx="11" cy="25" r="5" fill="#111" stroke="#1e2838" stroke-width="1"/>
  <circle cx="11" cy="75" r="5" fill="#111" stroke="#1e2838" stroke-width="1"/>
  <circle cx="565" cy="25" r="5" fill="#111" stroke="#1e2838" stroke-width="1"/>
  <circle cx="565" cy="75" r="5" fill="#111" stroke="#1e2838" stroke-width="1"/>
  <!-- ATEN Brand -->
  <text x="30" y="32" fill="#44aaff" font-family="Arial,sans-serif" font-size="11" font-weight="bold" letter-spacing="1">ATEN</text>
  <text x="30" y="46" fill="#80a8c8" font-family="Arial,sans-serif" font-size="8">KM1116VA</text>
  <!-- LCD display showing selected port -->
  <rect x="28" y="55" width="70" height="30" rx="2" fill="#050810" stroke="#44aaff" stroke-width="0.8"/>
  <text x="33" y="67" fill="#44aaff" font-family="'Courier New',monospace" font-size="7">PORT</text>
  <text x="33" y="79" fill="#44aaff" font-family="'Courier New',monospace" font-size="10" font-weight="bold">03</text>

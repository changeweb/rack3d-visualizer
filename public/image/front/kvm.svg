  <rect x="280" y="26" width="20" height="18" rx="1" fill="#060a0e" stroke="#1e2838" stroke-width="0.5"/>
  <rect x="303" y="26" width="20" height="18" rx="1" fill="#060a0e" stroke="#1e2838" stroke-width="0.5"/>
  <rect x="326" y="26" width="20" height="18" rx="1" fill="#060a0e" stroke="#1e2838" stroke-width="0.5"/>

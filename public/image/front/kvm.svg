  <text x="165" y="22" fill="#607888" font-family="Arial,sans-serif" font-size="7">Server Ports (16 × KVM)</text>
  <!-- Row 1: 8 ports -->
  <rect x="165" y="26" width="20" height="18" rx="1" fill="#060a0e" stroke="#1e2838" stroke-width="0.5"/>
  <rect x="188" y="26" width="20" height="18" rx="1" fill="#060a0e" stroke="#1e2838" stroke-width="0.5"/>
  <rect x="211" y="26" width="20" height="18" rx="1" fill="#060a0e" stroke="#44aaff" stroke-width="1"/>
  <rect x="234" y="26" width="20" height="18" rx="1" fill="#060a0e" stroke="#1e2838" stroke-width="0.5"/>
